# Example 2 runtime: identical shape to example 1.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainplot
      POSTGRES_PASSWORD: chainplot
      POSTGRES_DB: chainplot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainplot -d chainplot"]
      interval: 2s
      timeout: 5s
      retries: 30

  producer:
    build:
      context: ../..
      dockerfile: docker/producer.Dockerfile
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chainplot:chainplot@postgres:5432/chainplot
    volumes:
      - ./:/workspace
    working_dir: /workspace
    # `serve --host 0.0.0.0 --port 4173` inside the container is reachable from
    # a browser on this machine at http://127.0.0.1:4173, and from nowhere else.
    ports:
      - "127.0.0.1:4173:4173"
    entrypoint: ["sleep"]
    command: ["infinity"]

volumes:
  postgres-data:
